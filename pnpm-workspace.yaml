# pnpm 10.6+ 的配置文件（settings 原来放在 package.json 的 pnpm 字段，现已废弃）

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
  - swup
  - ttf2woff2

